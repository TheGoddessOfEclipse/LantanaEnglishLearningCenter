<head>

    <style>
        body{background-color:#050b14; font-family: sans-serif;} .bg-neon-bg{background-color:#050b14;}
        .cyber-box-cyan{border:1px solid #0ff;background:rgba(0,20,40,0.6);box-shadow:inset 0 0 15px rgba(0,255,255,0.1);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);}
        .cyber-box-green{border:1px solid #0f0;background:rgba(0,40,0,0.6);box-shadow:inset 0 0 15px rgba(0,255,0,0.1);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);}
        .cyber-box-yellow{border:1px solid #ff0;background:rgba(40,40,0,0.6);box-shadow:inset 0 0 15px rgba(255,255,0,0.1);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);}
        .cyber-box-red{border:1px solid #ff003c;background:rgba(40,0,0,0.6);box-shadow:inset 0 0 15px rgba(255,0,60,0.1);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);}
        .cyber-box-orange{border:1px solid #f97316;background:rgba(40,20,0,0.6);box-shadow:inset 0 0 15px rgba(249,115,22,0.1);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);}
        
        .scanline{background:linear-gradient(to bottom,transparent 50%,rgba(0,255,255,0.2) 51%);background-size:100% 4px;animation:scan 10s linear infinite;} @keyframes scan{0%{background-position:0 0;}100%{background-position:0 100vh;}}
        .fade-in{animation:fadeIn 0.5s ease-out;} @keyframes fadeIn{from{opacity:0; transform: translateY(10px);}to{opacity:1; transform: translateY(0);}}

        /* ================= ✨ 發光矩陣 ================= */
        .glow-cyan { animation: glowCyanAnim 0.8s ease-in-out infinite alternate !important; border-color: #0ff !important; z-index: 50 !important; }
        @keyframes glowCyanAnim { 0% { box-shadow: 0 0 10px #0ff, inset 0 0 10px rgba(0,255,255,0.3); transform: scale(1.02); } 100% { box-shadow: 0 0 30px #0ff, inset 0 0 20px rgba(0,255,255,0.6); transform: scale(1.05); } }

        .glow-green { animation: glowGreenAnim 0.8s ease-in-out infinite alternate !important; border-color: #0f0 !important; z-index: 50 !important; }
        @keyframes glowGreenAnim { 0% { box-shadow: 0 0 10px #0f0, inset 0 0 10px rgba(0,255,0,0.3); transform: scale(1.02); } 100% { box-shadow: 0 0 30px #0f0, inset 0 0 20px rgba(0,255,0,0.6); transform: scale(1.05); } }

        .glow-yellow { animation: glowYellowAnim 0.8s ease-in-out infinite alternate !important; border-color: #ff0 !important; z-index: 50 !important; }
        @keyframes glowYellowAnim { 0% { box-shadow: 0 0 10px #ff0, inset 0 0 10px rgba(255,255,0,0.3); transform: scale(1.02); } 100% { box-shadow: 0 0 30px #ff0, inset 0 0 20px rgba(255,255,0,0.6); transform: scale(1.05); } }

        .glow-red { animation: glowRedAnim 0.8s ease-in-out infinite alternate !important; border-color: #ff003c !important; z-index: 50 !important; }
        @keyframes glowRedAnim { 0% { box-shadow: 0 0 10px #ff003c, inset 0 0 10px rgba(255,0,60,0.3); transform: scale(1.02); } 100% { box-shadow: 0 0 30px #ff003c, inset 0 0 20px rgba(255,0,60,0.6); transform: scale(1.05); } }

        .glow-orange { animation: glowOrangeAnim 0.8s ease-in-out infinite alternate !important; border-color: #f97316 !important; z-index: 50 !important; }
        @keyframes glowOrangeAnim { 0% { box-shadow: 0 0 10px #f97316, inset 0 0 10px rgba(249,115,22,0.3); transform: scale(1.02); } 100% { box-shadow: 0 0 30px #f97316, inset 0 0 20px rgba(249,115,22,0.6); transform: scale(1.05); } }

        /* ================= ⚡ 封鎖結界 ================= */
        .vine-locked { position: relative; pointer-events: none !important; }
        .vine-locked > * { opacity: 0.4; filter: brightness(0.4) blur(1px) !important; transform: scale(0.98); transition: all 0.3s ease; }
        .vine-locked::after {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            background: radial-gradient(circle at 80% 20%, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.4) 80%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' preserveAspectRatio='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M80,20 L0,0 M80,20 L10,100 M80,20 L50,100 M80,20 L100,70 M80,20 L100,0 M80,20 L0,40 M50,16 L30,30 M30,30 L10,60 M85,55 L60,80 M60,80 L35,80 M35,80 L15,100' stroke='rgba(255,255,255,0.4)' stroke-width='0.5' fill='none'/%3E%3C/svg%3E");
            background-size: cover; backdrop-filter: contrast(1.1); z-index: 40; animation: shatterFlicker 3s infinite; clip-path: inherit; 
        }
        .vine-locked.rounded-full::after { clip-path: circle(50% at 50% 50%); }
        .vine-locked:not(.rounded-full):not([class*="cyber-box"])::after { clip-path: inset(0 round 8px); }
        .vine-locked::before {
            content: '✖ 權限封鎖'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-3deg);
            background: rgba(20, 0, 0, 0.85); border: 1px solid #ff003c; border-left: 4px solid #ff003c;
            color: #ff003c; padding: 6px 12px; border-radius: 2px; font-size: 0.85rem; font-weight: 900; letter-spacing: 0.2em;
            z-index: 41; box-shadow: 0 0 15px rgba(255, 0, 60, 0.4); text-shadow: 2px 2px 0px rgba(0, 255, 255, 0.5); white-space: nowrap;
        }
        @keyframes shatterFlicker { 0%, 100% { opacity: 1; } 92% { opacity: 1; } 93% { opacity: 0.6; } 96% { opacity: 0.3; } 98% { opacity: 1; } }

        /* ================= 標題閃爍特效 ================= */
        .cyber-glitch-title { position: relative; display: inline-block; animation: neon-shift 8s ease-in-out infinite, flicker 5s linear infinite; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; }
        .cyber-glitch-title::before, .cyber-glitch-title::after { content: '單字戰場'; position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8; }
        .cyber-glitch-title::before { color: #f0f; z-index: -1; animation: glitch-anim 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite; }
        .cyber-glitch-title::after { color: #0ff; z-index: -2; animation: glitch-anim-2 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) reverse infinite; }
        @keyframes glitch-anim { 0% { clip-path: polygon(0 20%, 100% 20%, 100% 21%, 0 21%); transform: translate(2px, 2px); } 5% { clip-path: polygon(0 33%, 100% 33%, 100% 34%, 0 34%); transform: translate(-2px, -2px); } 10% { clip-path: polygon(0 50%, 100% 50%, 100% 51%, 0 51%); transform: translate(2px, -2px); } 15% { clip-path: polygon(0 75%, 100% 75%, 100% 76%, 0 76%); transform: translate(-2px, 2px); } 20% { clip-path: polygon(0 20%, 100% 20%, 100% 21%, 0 21%); transform: translate(0, 0); } 100% { clip-path: polygon(0 20%, 100% 20%, 100% 21%, 0 21%); transform: translate(0, 0); } }
        @keyframes glitch-anim-2 { 0% { clip-path: polygon(0 10%, 100% 10%, 100% 11%, 0 11%); transform: translate(-1px, -1px); } 10% { clip-path: polygon(0 60%, 100% 60%, 100% 61%, 0 61%); transform: translate(1px, 1px); } 20% { clip-path: polygon(0 85%, 100% 85%, 100% 86%, 0 86%); transform: translate(-1px, 1px); } 30% { clip-path: polygon(0 10%, 100% 10%, 100% 11%, 0 11%); transform: translate(0, 0); } 100% { clip-path: polygon(0 10%, 100% 10%, 100% 11%, 0 11%); transform: translate(0, 0); } }
        @keyframes neon-shift { 0%, 100% { color: #fff; text-shadow: 0 0 10px #0ff, 0 0 20px #0ff; } 33% { color: #fff; text-shadow: 0 0 10px #f0f, 0 0 20px #f0f; } 66% { color: #fff; text-shadow: 0 0 10px #ff0, 0 0 20px #ff0; } }
        @keyframes flicker { 0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; } 20%, 24%, 55% { opacity: 0.6; } }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-neon-bg text-gray-200 min-h-screen font-sans relative overflow-x-hidden selection:bg-neon-cyan selection:text-black">
    <div class="fixed inset-0 pointer-events-none z-0" style="background-image:linear-gradient(rgba(0,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,255,0.03) 1px,transparent 1px);background-size:30px 30px;"></div>

    <div id="app" class="max-w-6xl mx-auto flex flex-col relative z-10 min-h-screen p-4 md:p-6">

        <div v-if="showRealtimeMsg" class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/95 backdrop-blur-sm p-4 fade-in">
            <div class="cyber-box-red w-full max-w-lg p-8 relative overflow-hidden bg-gradient-to-b from-red-900/40 to-black text-center border-2 border-neon-red shadow-[0_0_40px_rgba(255,0,60,0.5)]">
                <div class="absolute inset-0 scanline opacity-30 pointer-events-none"></div>
                <div class="text-6xl mb-4 animate-bounce relative z-10">🚨</div>
                <h2 class="text-2xl md:text-3xl font-black text-neon-red tracking-widest mb-6 relative z-10">總司令部緊急廣播</h2>
                <div class="bg-black/80 border border-red-800 p-6 mb-8 relative z-10">
                    <p class="text-white text-lg md:text-xl font-bold tracking-wider leading-relaxed">{{ realtimeMsg }}</p>
                </div>
                <button @click="showRealtimeMsg = false" class="w-full bg-neon-red text-white py-4 font-black tracking-widest transition shadow-[0_0_20px_#f00] text-lg">收到，長官！</button>
            </div>
        </div>

        <div v-if="isConfigMissing" class="fixed inset-0 z-[999] bg-black/95 backdrop-blur-md flex flex-col items-center justify-center p-8 text-center">
            <div class="text-6xl mb-4 animate-pulse">⚠️</div>
            <h1 class="text-3xl text-neon-red font-black mb-4 tracking-widest drop-shadow-[0_0_15px_#f00]">無法讀取 config.js</h1>
            <p class="text-lg text-gray-300 font-bold leading-relaxed">請將檔案放在電腦上同一個資料夾開啟。</p>
        </div>

        <div v-if="isAuthorized" class="fade-in flex flex-col flex-1">

            <div class="flex justify-between items-center mb-4 border-b border-gray-700/50 pb-2 w-full pt-2">
                <button @click="goBack" class="text-sm font-bold tracking-widest text-gray-400 hover:text-white transition flex items-center gap-2 border border-gray-600 hover:border-white px-3 py-1.5 rounded-lg bg-black/50 active:scale-95 z-20">
                    Back <span class="text-lg leading-none">↩</span>
                </button>
                <div class="text-xs md:text-sm font-bold tracking-widest text-gray-300 flex items-center gap-2">
                    <i class="fas fa-user-secret text-neon-cyan"></i> 特工 // <span class="text-white">{{ playerName }}</span>
                </div>
            </div>

            <div class="text-center mb-10 mt-4 relative z-10">
                <div class="text-6xl mb-4 drop-shadow-[0_0_20px_#0ff] animate-pulse">🔥</div>
                <h1 class="text-4xl md:text-5xl font-black mb-2 tracking-widest"><span class="cyber-glitch-title">單字戰場</span></h1>
                <p class="text-cyan-600 font-bold tracking-widest text-sm">> 選擇日常自主訓練模式</p>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
                
                <button @click="systemModes.flashcard ? navigateTo('flashcard.html') : null" 
                        class="cyber-box-cyan p-6 transition-all flex flex-col items-center justify-center gap-3 relative group hover:shadow-[0_0_30px_rgba(0,255,255,0.4)] cursor-pointer" 
                        :class="{'vine-locked': locks?.vocab_modes?.flashcard || !systemModes.flashcard, 'glow-cyan': highlights?.vocab_modes?.flashcard}">
                    <div @click.stop="openInfo('flashcard')" class="absolute top-3 right-3 text-cyan-600 border border-cyan-700 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold hover:text-neon-cyan hover:border-neon-cyan transition z-20 pointer-events-auto">?</div>
                    <span class="text-5xl mb-1 transition-all duration-300 drop-shadow-[0_0_5px_rgba(255,255,255,0.3)] group-hover:scale-110">📇</span>
                    <h2 class="text-lg md:text-xl font-bold tracking-widest whitespace-nowrap text-neon-cyan">單字卡模式</h2>
                </button>
                
                <button @click="systemModes.quiz ? navigateTo('quiz.html') : null" 
                        class="cyber-box-green p-6 transition-all flex flex-col items-center justify-center gap-3 relative group hover:shadow-[0_0_30px_rgba(0,255,0,0.4)] cursor-pointer" 
                        :class="{'vine-locked': locks?.vocab_modes?.quiz || !systemModes.quiz, 'glow-green': highlights?.vocab_modes?.quiz}">
                    <div @click.stop="openInfo('quiz')" class="absolute top-3 right-3 text-green-600 border border-green-700 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold hover:text-neon-green hover:border-neon-green transition z-20 pointer-events-auto">?</div>
                    <span class="text-5xl mb-1 transition-all duration-300 drop-shadow-[0_0_5px_rgba(255,255,255,0.3)] group-hover:scale-110">🎯</span>
                    <h2 class="text-lg md:text-xl font-bold tracking-widest whitespace-nowrap text-neon-green">自我考驗</h2>
                </button>
                
                <button @click="systemModes.blindTest !== false ? navigateTo('blindTest.html') : null" 
                        class="cyber-box-yellow p-6 transition-all flex flex-col items-center justify-center gap-3 relative group hover:shadow-[0_0_30px_rgba(255,255,0,0.4)] cursor-pointer" 
                        :class="{'vine-locked': locks?.vocab_modes?.blindTest || systemModes.blindTest === false, 'glow-yellow': highlights?.vocab_modes?.blindTest}">
                    <div @click.stop="openInfo('blindTest')" class="absolute top-3 right-3 text-yellow-600 border border-yellow-700 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold hover:text-neon-yellow hover:border-neon-yellow transition z-20 pointer-events-auto">?</div>
                    <span class="text-5xl mb-1 transition-all duration-300 drop-shadow-[0_0_5px_rgba(255,255,255,0.3)] group-hover:scale-110">🧠</span>
                    <h2 class="text-lg md:text-xl font-bold tracking-widest whitespace-nowrap text-neon-yellow">字義盲測</h2>
                </button>
                
                <button @click="systemModes.battle ? navigateTo('battle.html') : null" 
                        class="cyber-box-red p-6 transition-all flex flex-col items-center justify-center gap-3 relative group hover:shadow-[0_0_30px_rgba(255,0,60,0.5)] cursor-pointer" 
                        :class="{'vine-locked': locks?.vocab_modes?.battle || !systemModes.battle, 'glow-red': highlights?.vocab_modes?.battle}">
                    <div class="absolute top-0 left-0 bg-neon-red text-white font-black text-[10px] px-2 py-1 tracking-widest z-10 rounded-br-lg">PVP</div>
                    <div @click.stop="openInfo('battle')" class="absolute top-3 right-3 text-red-600 border border-red-700 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold hover:text-neon-red hover:border-neon-red transition z-20 pointer-events-auto">?</div>
                    <span class="text-5xl mb-1 mt-3 transition-all duration-300 drop-shadow-[0_0_5px_rgba(255,255,255,0.3)] group-hover:scale-110">⚔️</span>
                    <h2 class="text-lg md:text-xl font-bold tracking-widest whitespace-nowrap text-neon-red" style="text-shadow:0 0 10px rgba(255,0,60,0.7);">雙人死鬥</h2>
                </button>

                <button @click="systemModes.vocab_exam !== false ? navigateTo('vocab_exam.html') : null" 
                        class="cyber-box-orange p-6 transition-all flex flex-col items-center justify-center gap-3 relative group hover:shadow-[0_0_30px_rgba(249,115,22,0.4)] cursor-pointer md:col-span-4 lg:col-span-1 col-span-2" 
                        :class="{'vine-locked': locks?.vocab_modes?.vocab_exam || systemModes.vocab_exam === false, 'glow-orange': highlights?.vocab_modes?.vocab_exam}">
                    <div @click.stop="openInfo('vocab_exam')" class="absolute top-3 right-3 text-orange-600 border border-orange-700 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold hover:text-orange-400 hover:border-orange-400 transition z-20 pointer-events-auto">?</div>
                    <span class="text-5xl mb-1 transition-all duration-300 drop-shadow-[0_0_5px_rgba(255,255,255,0.3)] group-hover:scale-110">🔥</span>
                    <h2 class="text-lg md:text-xl font-bold tracking-widest whitespace-nowrap text-orange-400">會考實戰</h2>
                </button>
            </div>

            <div class="mt-auto pt-12 pb-4 text-center w-full">
                <div class="inline-block border-t border-gray-800/80 pt-4 px-8">
                    <p class="text-[11px] md:text-xs text-gray-600 font-bold tracking-widest cursor-default transition">
                        【 © 2026 本網頁為 Jason Wang 之智慧財產，非經同意，切勿隨意轉載。 】
                    </p>
                </div>
            </div>
        </div>

        <div v-if="showInfoModal" class="fixed inset-0 z-[500] flex items-center justify-center bg-black/90 backdrop-blur-sm p-4 fade-in">
            <div class="cyber-box-cyan w-full max-w-lg p-6 md:p-8 relative bg-black/90 border border-cyan-500 shadow-[0_0_30px_rgba(0,255,255,0.2)]">
                <button @click="closeInfo" class="absolute top-4 right-4 text-cyan-700 hover:text-neon-cyan text-2xl font-bold leading-none transition">&times;</button>
                <div class="text-center mb-6">
                    <span class="text-5xl block mb-4">{{ currentInfo.icon }}</span>
                    <h2 class="text-2xl font-black tracking-widest" :class="currentInfo.color">{{ currentInfo.title }}</h2>
                </div>
                <div class="text-gray-300 text-sm leading-relaxed tracking-wider font-bold space-y-4">
                    <p v-html="currentInfo.desc"></p>
                </div>
                <div class="mt-8 text-center">
                    <button @click="closeInfo" class="bg-gray-800 text-gray-300 hover:bg-gray-700 px-6 py-2 text-sm font-bold tracking-widest transition border border-gray-600">我了解了</button>
                </div>
            </div>
        </div>

        <div class="fixed z-[9999] flex flex-col items-end"
             :style="{ left: portalPos.x + 'px', top: portalPos.y + 'px', touchAction: 'none', transition: isDraggingPortal ? 'none' : 'all 0.3s cubic-bezier(0.25, 1, 0.5, 1)' }"
             @mousedown.prevent="startDragPortal" @touchstart="startDragPortal">
            
            <transition name="fade">
                <div v-if="showGlobalNav" 
                     :class="menuConfig.class"
                     class="bg-black/95 border-2 border-gray-700 rounded-xl p-2 flex flex-col gap-1 shadow-[0_0_20px_rgba(255,255,255,0.1)] backdrop-blur-md w-40" 
                     @mousedown.stop @touchstart.stop>
                    <div class="text-[10px] text-gray-500 font-bold text-center border-b border-gray-800 pb-1 mb-1 tracking-widest uppercase">Portal System</div>
                    <button onclick="window.location.href='index.html'" class="text-sm font-bold text-left px-3 py-2 text-gray-300 hover:text-white hover:bg-gray-800 rounded transition flex items-center gap-2"><i class="fas fa-home w-4"></i> 總部大廳</button>
                    <button onclick="window.location.href='vocab.html'" class="text-sm font-bold text-left px-3 py-2 text-cyan-400 hover:text-neon-cyan hover:bg-cyan-900/50 rounded transition flex items-center gap-2"><i class="fas fa-book w-4"></i> 單字戰場</button>
                    <button onclick="window.location.href='verb_training.html'" class="text-sm font-bold text-left px-3 py-2 text-fuchsia-400 hover:text-pink-400 hover:bg-fuchsia-900/50 rounded transition flex items-center gap-2"><i class="fas fa-dna w-4"></i> 變體之戰</button>
                    <button onclick="window.location.href='grammar.html'" class="text-sm font-bold text-left px-3 py-2 text-emerald-400 hover:text-neon-green hover:bg-emerald-900/50 rounded transition flex items-center gap-2"><i class="fas fa-link w-4"></i> 文法戰場</button>
                    <button onclick="window.location.href='mixed_exam.html'" class="text-sm font-bold text-left px-3 py-2 text-yellow-400 hover:text-neon-yellow hover:bg-yellow-900/50 rounded transition flex items-center gap-2"><i class="fas fa-history w-4"></i> 歷史戰役</button>
                    <button onclick="window.location.href='special_mission.html'" class="text-sm font-bold text-left px-3 py-2 text-orange-400 hover:text-orange-300 hover:bg-orange-900/50 rounded transition flex items-center gap-2"><i class="fas fa-satellite-dish w-4"></i> 特派任務</button>
                </div>
            </transition>
            
            <button @click="togglePortal" 
                    class="w-14 h-14 bg-gray-900/90 border-2 border-gray-400 rounded-full flex items-center justify-center text-white hover:border-cyan-400 hover:text-neon-cyan transition-colors shadow-[0_0_15px_rgba(255,255,255,0.2)] hover:shadow-[0_0_20px_#0ff] relative overflow-hidden cursor-move">
                <i class="fas fa-dharmachakra text-3xl absolute opacity-30" style="animation: spin 4s linear infinite;"></i>
                <i class="fas" :class="showGlobalNav ? 'fa-times text-xl z-10' : 'fa-bullseye text-xl z-10 animate-pulse'"></i>
            </button>
        </div>
    </div>

    <script>
        if (typeof FIREBASE_CONFIG === 'undefined') { window.FIREBASE_CONFIG = { apiKey: "preview", authDomain: "preview", databaseURL: "preview", projectId: "preview" }; }
        if (!firebase.apps.length) { firebase.initializeApp(FIREBASE_CONFIG); }
        const db = firebase.database();
        const auth = firebase.auth(); 
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                // --- 🌟 統一返回大廳邏輯 ---
                const goBack = () => { window.location.href = 'index.html'; };
                const isConfigMissing = ref(FIREBASE_CONFIG.apiKey === 'preview');
                
                // --- 🌟 空間躍傳引擎 (全域無卡頓拖曳 + 四向磁吸版) ---
                const showGlobalNav = ref(false);
                const portalPos = ref({ x: window.innerWidth - 80, y: window.innerHeight - 100 });
                const isDraggingPortal = ref(false); // 必須是 ref 才能綁定到 CSS
                let startMouse = { x: 0, y: 0 };
                let startPos = { x: 0, y: 0 };
                let hasMovedPortal = false;

                const startDragPortal = (e) => {
                    isDraggingPortal.value = true; 
                    hasMovedPortal = false;
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    startMouse = { x: clientX, y: clientY };
                    startPos = { ...portalPos.value };
                    
                    // 🌟 將拖曳監聽器綁定到 document 上，解決滑鼠移動太快跟丟的問題
                    document.addEventListener('mousemove', onDragPortal);
                    document.addEventListener('mouseup', endDragPortal);
                    document.addEventListener('touchmove', onDragPortal, { passive: false });
                    document.addEventListener('touchend', endDragPortal);
                };
                
                const onDragPortal = (e) => {
                    if (!isDraggingPortal.value) return;
                    e.preventDefault(); // 防止手機端拖曳時畫面跟著捲動
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    const dx = clientX - startMouse.x; 
                    const dy = clientY - startMouse.y;
                    
                    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMovedPortal = true;
                    
                    let newX = startPos.x + dx; 
                    let newY = startPos.y + dy;
                    
                    // 防止球被拖出螢幕邊界
                    const ballWidth = 56;
                    newX = Math.max(0, Math.min(newX, window.innerWidth - ballWidth));
                    newY = Math.max(0, Math.min(newY, window.innerHeight - ballWidth));
                    portalPos.value = { x: newX, y: newY };
                };
                
                const endDragPortal = () => {
                    if (!isDraggingPortal.value) return;
                    isDraggingPortal.value = false;
                    
                    // 🌟 四向邊緣磁吸計算
                    const w = window.innerWidth; 
                    const h = window.innerHeight; 
                    const ballSize = 56; 
                    const p = 15; // 邊距
                    
                    const distL = portalPos.value.x; 
                    const distR = w - portalPos.value.x - ballSize;
                    const distT = portalPos.value.y; 
                    const distB = h - portalPos.value.y - ballSize;
                    const minDist = Math.min(distL, distR, distT, distB);
                    
                    if (minDist === distL) portalPos.value.x = p;
                    else if (minDist === distR) portalPos.value.x = w - ballSize - p;
                    else if (minDist === distT) portalPos.value.y = p;
                    else portalPos.value.y = h - ballSize - p;
                    
                    document.removeEventListener('mousemove', onDragPortal);
                    document.removeEventListener('mouseup', endDragPortal);
                    document.removeEventListener('touchmove', onDragPortal);
                    document.removeEventListener('touchend', endDragPortal);
                };

                const togglePortal = () => { 
                    // 只有在純點擊(未拖曳)時，才展開選單
                    if (!hasMovedPortal) showGlobalNav.value = !showGlobalNav.value; 
                };

                const menuConfig = computed(() => {
                    const w = window.innerWidth; const h = window.innerHeight;
                    const x = portalPos.value.x; const y = portalPos.value.y;
                    let cls = "absolute ";
                    // 自動判斷選單展開方向，避免被切掉
                    if (y < h / 2) cls += "top-full mt-2 "; else cls += "bottom-full mb-2 ";
                    if (x < w / 2) cls += "left-0 origin-top-left "; else cls += "right-0 origin-top-right ";
                    return { class: cls };
                });

                window.addEventListener('resize', () => { portalPos.value = { x: window.innerWidth - 80, y: window.innerHeight - 100 }; });

                // --- 🌟 Firebase 狀態與系統變數 ---
                const playerName = ref(localStorage.getItem('shilieu_player') || '');
                const isAuthorized = ref(false); 
                const systemModes = ref({ flashcard: true, quiz: true, blindTest: true, battle: true, vocab_exam: true });
                const highlights = ref({ vocab_modes: {}, themes: {} });
                const locks = ref({ vocab_modes: {}, themes: {} });
                const showInfoModal = ref(false);
                const currentInfo = ref({});
                const realtimeMsg = ref('');
                const showRealtimeMsg = ref(false);
                const lastMsgTimestamp = ref(Date.now());
                
                const infoData = {
                    flashcard: { icon: '📇', title: '單字卡模式', color: 'text-neon-cyan', desc: '適合<span class="text-neon-cyan">初次學習或複習</span>。<br>系統會顯示英文單字與發音，您可以選擇隱藏或顯示中文意思，幫助您穩紮穩打建立單字記憶。' },
                    quiz: { icon: '🎯', title: '自我考驗', color: 'text-neon-green', desc: '適合用來<span class="text-neon-green">驗收學習成果</span>。<br>系統會發音並顯示英文，請從四個選項中選出正確的中文意思。答錯的題目會在結算時列出，並可針對錯題反覆練習。' },
                    blindTest: { icon: '🧠', title: '字義盲測', color: 'text-neon-yellow', desc: '最高難度的<span class="text-neon-yellow">極限記憶挑戰</span>。<br>畫面上只有英文，沒有選項！請在腦中回想中文意思，點擊後誠實記錄自己「是否背熟」。最真實的記憶力考驗！' },
                    battle: { icon: '⚔️', title: '雙人死鬥', color: 'text-neon-red', desc: '刺激的<span class="text-neon-red">連線對戰模式</span>！<br>創建或加入房間，與同學進行即時單字搶答。答對可攻擊對手或補血，連對還會觸發 Combo 疊加傷害，活到最後的才是贏家！' },
                    vocab_exam: { icon: '🔥', title: '會考單字實戰', color: 'text-orange-400', desc: '專為國中教育會考設計的<span class="text-orange-400">實戰模擬器</span>。<br>透過歷屆真實考題，訓練您在完整句意中精準判斷單字用法的能力。答錯會提供詳細解析！' }
                };

                onMounted(() => {

                    auth.onAuthStateChanged(user => {
                        if (user) {
                            isAuthorized.value = true;
                            db.ref(`app_state/users/${user.uid}`).once('value').then(snap => {
                                if (snap.exists()) {
                                    const profile = snap.val();
                                    playerName.value = profile.realName || profile.studentId;
                                    localStorage.setItem('shilieu_player', playerName.value);
                                }
                            });
                        } else {
                            if (!isConfigMissing.value) {
                                alert('⚠️ 系統偵測到您尚未通過總部驗證，將遣返大廳！');
                                window.location.href = 'index.html';
                            }
                        }
                    });

                    db.ref('app_state/system_settings').on('value', snap => {
                        if (snap.exists()) {
                            const data = snap.val();
                            if (data.modes) systemModes.value = data.modes;
                            if (data.highlights) highlights.value = data.highlights;
                            if (data.locks) locks.value = data.locks;
                        }
                    });

                    db.ref('app_state/realtime_msg').on('value', snap => {
                        const val = snap.val();
                        if (val && val.timestamp > lastMsgTimestamp.value) {
                            realtimeMsg.value = val.text;
                            showRealtimeMsg.value = true;
                            lastMsgTimestamp.value = val.timestamp;
                        }
                    });
                });

                const navigateTo = (url) => { window.location.href = url; };
                const openInfo = (mode) => { currentInfo.value = infoData[mode]; showInfoModal.value = true; };
                const closeInfo = () => { showInfoModal.value = false; };

                // --- 🌟 變數全輸出 ---
                return {
                    isConfigMissing, isAuthorized, playerName, goBack,
                    systemModes, highlights, locks, navigateTo,
                    showInfoModal, currentInfo, openInfo, closeInfo,
                    realtimeMsg, showRealtimeMsg, 
                    // 🌟 空間引擎必須導出的變數
                    showGlobalNav, portalPos, isDraggingPortal, startDragPortal, togglePortal, menuConfig
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
